[project]
name = "pricewatch"
version = "0.1.0"
description = "A small swarm of agents that track prices across storefronts."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
llm = ["openai>=1.30", "anthropic>=0.25", "google-generativeai>=0.5.0"]
[project.scripts]
pricewatch = "pricewatch.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["pricewatch*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
